name: convert

# A battle document is what mechcore's converter writes from its replay, and
# nothing else, so this workflow is the only thing that writes `battle/`. It
# checks out mechcore at the commit `MECHCORE_REV` names, converts every
# replay of every build, verifies every document, and commits what changed.
# Bumping `MECHCORE_REV` is how a converter change reaches the corpus, and the
# commit this makes is the record of what the change did to it.
#
# A push made with the workflow's own token starts no further run, so the
# commit does not trigger this workflow again.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: convert
  cancel-in-progress: false

jobs:
  battle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: The mechcore this corpus is converted by
        id: pin
        run: echo "rev=$(tr -d '[:space:]' < MECHCORE_REV)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: qbisi/mechcore
          ref: ${{ steps.pin.outputs.rev }}
          path: mechcore

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            mechcore/target
          key: cargo-convert-${{ runner.os }}-${{ steps.pin.outputs.rev }}
          restore-keys: cargo-convert-${{ runner.os }}-

      # mechcore's rust-toolchain.toml pins the nightly; cargo run from inside
      # that checkout installs it.
      - name: Build the converter, without the Adapter
        working-directory: mechcore
        run: cargo build --release -p mechcore --no-default-features

      - name: Convert every replay of every build
        run: |
          set -eu
          for corpus in replays/*/; do
            python3 mechcore/scripts/export-replay-corpus.py \
              --mechcore mechcore/target/release/mechcore --corpus "$corpus"
          done

      - name: Every document verifies
        run: |
          set -eu
          for corpus in replays/*/; do
            python3 mechcore/scripts/verify-battles.py \
              --mechcore mechcore/target/release/mechcore --battle-dir "$corpus/battle"
          done

      - name: Commit what the converter changed
        run: |
          set -eu
          git add replays
          if git diff --cached --quiet; then
            echo "the corpus is what mechcore ${{ steps.pin.outputs.rev }} writes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "convert: what mechcore ${{ steps.pin.outputs.rev }} writes from every replay"
          git push
