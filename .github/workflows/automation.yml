name: Automation checks

on:
  push:
    branches: [master]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']

permissions:
  contents: read

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Test selection and issue lifecycle with fake verify results
        run: uv run --with pyyaml python -m unittest discover -s .github/scripts -p 'test_*.py' -v
